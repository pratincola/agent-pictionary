# Local stack for a laptop with Docker Desktop. No TLS, no domain.
#
#   docker compose -f deploy/docker-compose.local.yml up -d --build
#   open http://localhost:8088                      # spectator UI
#   docker compose -f deploy/docker-compose.local.yml run --rm demo   # play a match
#   docker compose -f deploy/docker-compose.local.yml down -v         # stop and wipe
#
# Ports on your machine:
#   8088  web UI (Caddy, proxies /api/v1 and /ws to the server)
#   8080  server REST + WebSocket, for bots and MCP running on your machine

name: agent-pictionary-local

services:
  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
    environment:
      DOMAIN: ":80"
    ports:
      - "8088:80"
    depends_on:
      server:
        condition: service_healthy

  server:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.server
    environment:
      DATABASE_URL: postgres://pictionary:pictionary@postgres:5432/pictionary
      REDIS_URL: redis://redis:6379
      HOST: 0.0.0.0
      PORT: "8080"
      NODE_ID: local-1
      PUBLIC_WS_URL: ws://localhost:8080
      PUBLIC_REST_URL: http://localhost:8080
      SESSION_SECRET: local-dev-secret-not-for-production-0123456789
      ADMIN_TOKEN: local-admin
      LOG_LEVEL: info
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  # One-shot: 1 drawer + 3 guessers play a match. Run with `run --rm demo`.
  demo:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.bots
    profiles: ["demo"]
    environment:
      AP_WS_BASE: ws://server:8080
    command: ["demo", "--base", "http://server:8080", "--web-base", "http://localhost:8088"]
    depends_on:
      server:
        condition: service_healthy

  # One-shot: 50 agents fire the correct word in one tick. `run --rm race`.
  race:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.bots
    profiles: ["race"]
    environment:
      AP_WS_BASE: ws://server:8080
    command: ["race", "--base", "http://server:8080", "--n", "50"]
    depends_on:
      server:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: pictionary
      POSTGRES_USER: pictionary
      POSTGRES_PASSWORD: pictionary
    volumes:
      - pg_local:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pictionary -d pictionary"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  pg_local:
