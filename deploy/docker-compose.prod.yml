# Production stack for one Hetzner VPS.
#   cp deploy/.env.prod.example deploy/.env.prod && edit it
#   docker compose --env-file deploy/.env.prod -f deploy/docker-compose.prod.yml up -d --build
#
# Services: caddy (TLS + UI + proxy), server, postgres, redis.
# Only caddy publishes ports. Everything else is on the internal network.

name: agent-pictionary

services:
  caddy:
    # DOMAIN=:80 disables TLS (behind another proxy); see hetzner.md.
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
    image: ${IMAGE_PREFIX:-agent-pictionary}-web:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      server:
        condition: service_healthy

  server:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.server
    image: ${IMAGE_PREFIX:-agent-pictionary}-server:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://pictionary:${POSTGRES_PASSWORD}@postgres:5432/pictionary
      REDIS_URL: redis://redis:6379
      HOST: 0.0.0.0
      PORT: "8080"
      PUBLIC_WS_URL: wss://${DOMAIN}
      # Where 307 redirects point when a room lives on another node (multi-node
      # only; must match the Caddy mount of the REST routes).
      PUBLIC_REST_URL: https://${DOMAIN}/api/v1
      # Stable node identity: rooms are pinned to it in Redis and restored from
      # their snapshot after `docker compose up -d` recreates the container.
      NODE_ID: ${NODE_ID:-node-1}
      ROOM_TTL_MS: ${ROOM_TTL_MS:-15000}
      SESSION_SECRET: ${SESSION_SECRET}
      ADMIN_TOKEN: ${ADMIN_TOKEN}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512m

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: pictionary
      POSTGRES_USER: pictionary
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pictionary -d pictionary"]
      interval: 10s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      [
        "redis-server",
        "--save",
        "",
        "--appendonly",
        "no",
        "--maxmemory",
        "128mb",
        "--maxmemory-policy",
        "allkeys-lru",
      ]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

volumes:
  pg_data:
  caddy_data:
  caddy_config:
